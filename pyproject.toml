[project]
name = "editlock"
version = "0.1.0"
description = "On-device, mask-protected image editing for macOS"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mflux==0.24.0",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "numpy>=2,<3",
  "pillow>=11,<14",
  "opencv-python>=4.10,<6",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "ijson>=3,<4",
  "requests>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
